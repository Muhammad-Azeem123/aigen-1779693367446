<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        #helloButton {
            padding: 15px 30px;
            font-size: 24px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        #helloButton:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        #helloButton:active {
            transform: translateY(0);
            box-shadow: 0 2px 3px rgba(0, 0, 0, 0.1);
        }

        #displayArea {
            margin-top: 30px;
            font-size: 28px;
            font-weight: bold;
            color: #28a745; /* Green for the displayed text */
            padding: 20px;
            background-color: #e9ecef;
            border-radius: 8px;
            min-width: 300px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>

    <button id="helloButton">Hello world</button>

    <div id="displayArea">Click "Hello world" above!</div>

    <script>
        // Get references to the button and the display area
        const helloButton = document.getElementById('helloButton');
        const displayArea = document.getElementById('displayArea');

        // Add an event listener to the button
        helloButton.addEventListener('click', function() {
            // *** THE FIX IS HERE ***
            // Change the text content of the displayArea to "OCTEK AI APP Builder"
            displayArea.textContent = "OCTEK AI APP Builder";
            // If you want to log it to the console as well:
            console.log("Displayed: OCTEK AI APP Builder");
        });
    </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js')
          .then(function (reg) { console.log('[PWA] SW registered:', reg.scope); })
          .catch(function (err) { console.warn('[PWA] SW registration failed:', err); });
      });
    }
  </script>
</body>
</html>
